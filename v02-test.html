<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DreamLand Studios</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f6f7fb;--card:#ffffff;--text:#1b1f2a;--muted:#6a7183;--line:#e3e6ef;--accent:#5b4bdb;--ok:#1f9d55;--bad:#d64545;--warn:#b86e00}
@media (prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1b1e2a;--text:#eceef5;--muted:#9aa1b5;--line:#2b3042;--accent:#8f82ff;--ok:#4cc380;--bad:#ff7a7a;--warn:#e5a94a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(60px,env(safe-area-inset-bottom))}
h1{margin:8px 0 0;font-size:24px}
h2{margin:20px 0 10px;font-size:19px}
h3{margin:0 0 8px;font-size:16px}
.sub{margin:2px 0 10px;color:var(--muted);font-size:14px}
.hint{margin:4px 0 8px;color:var(--muted);font-size:13px}
ul.list{margin:6px 0;padding-left:20px;font-size:14px;color:var(--muted)}
ul.list li{margin:4px 0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.banner{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted)}
.banner+.banner{margin-top:8px}
.banner.bad{border-left-color:var(--bad)}
.banner b{color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px}
.stat span{color:var(--muted);font-size:13px}
.video,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.vtitle{font-weight:600}
.desc{color:var(--muted);font-size:14px;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;font-size:13px;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.kids{color:var(--warn);border-color:var(--warn)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}
.bar div{height:100%;background:var(--accent)}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.on,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px}
button.act{flex:1 1 120px;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit}
button.yes{background:var(--ok)}
button.no{background:var(--bad)}
button.undo{background:var(--muted)}
.st-review{color:var(--warn)}
.st-approved{color:var(--ok)}
.st-rejected{color:var(--bad)}
.field{margin-top:12px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:16px}
textarea{min-height:90px;resize:vertical}
textarea.script{min-height:340px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.5}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;font-family:inherit}
.step.done{border-color:var(--accent)}
.step.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.scene{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px;margin-top:12px}
.scenehead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.scenehead .btns{margin-top:0}
.savestat{font-size:13px;color:var(--muted);margin:2px 0 8px}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.linkbox{margin-top:8px;font-size:14px}
.linkbox a{color:var(--accent);font-weight:600}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:92vw;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>DreamLand Studios</h1>
  <p class="sub">Studio dashboard &middot; prototype v0.2 &middot; manual demo platform</p>
  <nav class="nav" id="nav"></nav>
  <div class="banner"><b>Manual demo platform. </b>Nothing here generates AI content, connects to YouTube, or publishes anything. Real integrations come later.</div>
  <div class="banner" id="banner-storage"></div>
  <main id="app"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  "use strict";

  /* ---------- Fixed lists ---------- */
  var STAGES = ["Idea", "Script", "Images", "Animation", "Voice & SFX", "Editing", "Packaging", "Approval"];
  var APPROVAL = STAGES.length - 1;

  var CHANNELS = [
    { id: "bb", name: "Backyard Bandits" },
    { id: "rk", name: "REKVRY365" },
    { id: "ua", name: "The Unknown Archives" },
    { id: "bc", name: "The Biblical Chronicles" },
    { id: "eh", name: "Everyday Heros", kids: true },
    { id: "dm", name: "Diner Mayhem" },
    { id: "tp", name: "Trash Panda TV" }
  ];

  // The sample videos from v0.1, kept as sample projects. Same order as v0.1 (ids 1 to 9).
  var SAMPLES = [
    { id: "s1", ch: "bb", title: "Sample: The Great Birdfeeder Heist", stage: 7 },
    { id: "s2", ch: "bb", title: "Sample: Midnight Sprinkler Escape", stage: 7 },
    { id: "s3", ch: "bb", title: "Sample: Fence Line Getaway", stage: 3 },
    { id: "s4", ch: "rk", title: "Sample: Morning Routine Reset", stage: 5 },
    { id: "s5", ch: "ua", title: "Sample: The Lighthouse Logbook", stage: 1 },
    { id: "s6", ch: "bc", title: "Sample: A Story From the Wilderness", stage: 2 },
    { id: "s7", ch: "eh", title: "Sample: Helping Hands Day", stage: 7 },
    { id: "s8", ch: "dm", title: "Sample: The Soup Special Disaster", stage: 4 },
    { id: "s9", ch: "tp", title: "Sample: Dumpster Dive Olympics", stage: 0 }
  ];

  var KEY = "dreamland_v2";
  var OLD_KEY = "dreamland_demo_v1"; // v0.1 stored only Approve/Reject choices here
  var LIMITS = { title: 200, description: 3000, idea: 6000, script: 200000, scene: 6000, url: 1000, projects: 500, scenes: 200 };

  /* ---------- Small helpers ---------- */
  var app = document.getElementById("app");
  var storageOk = true;
  var selected = "all";
  var newChannel = null;
  var saveTimer = null;
  var saveEl = null;
  var toastTimer = null;
  var fieldCounter = 0;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text !== undefined) { n.textContent = text; }
    return n;
  }
  function btn(label, cls, fn) {
    var b = el("button", "btn" + (cls ? " " + cls : ""), label);
    b.type = "button";
    b.addEventListener("click", fn);
    return b;
  }
  function nowISO() { return new Date().toISOString(); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function dateStr() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function timeStr() { return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  function fmtDate(iso) {
    if (!iso) { return "never"; }
    var d = new Date(iso);
    if (isNaN(d.getTime())) { return "unknown"; }
    return d.toLocaleString([], { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }
  function uid() { return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function str(v, max) { if (typeof v !== "string") { return ""; } return v.length > max ? v.slice(0, max) : v; }
  function safeUrl(s) {
    s = (s || "").trim();
    if (!s) { return null; }
    try {
      var u = new URL(s);
      return (u.protocol === "http:" || u.protocol === "https:") ? u.href : null;
    } catch (e) { return null; }
  }
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "show";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ""; }, 3800);
  }

  /* ---------- Data: normalise, load, save ---------- */
  function normScene(s) {
    s = s && typeof s === "object" ? s : {};
    return {
      id: str(s.id, 40) || uid(),
      title: str(s.title, LIMITS.title),
      imagePrompt: str(s.imagePrompt, LIMITS.scene),
      animation: str(s.animation, LIMITS.scene),
      narration: str(s.narration, LIMITS.scene)
    };
  }
  function normProject(p) {
    if (!p || typeof p !== "object") { return null; }
    var stage = parseInt(p.stage, 10);
    if (!(stage >= 0 && stage < STAGES.length)) { stage = 0; }
    var decision = (p.decision === "approved" || p.decision === "rejected") && stage === APPROVAL ? p.decision : null;
    var t = nowISO();
    return {
      id: str(p.id, 40) || uid(),
      channelId: str(p.channelId, 40) || CHANNELS[0].id,
      title: str(p.title, LIMITS.title) || "Untitled project",
      description: str(p.description, LIMITS.description),
      idea: str(p.idea, LIMITS.idea),
      stage: stage,
      decision: decision,
      script: str(p.script, LIMITS.script),
      scenes: Array.isArray(p.scenes) ? p.scenes.slice(0, LIMITS.scenes).map(normScene) : [],
      previewUrl: str(p.previewUrl, LIMITS.url),
      sample: p.sample === true,
      created: str(p.created, 40) || t,
      updated: str(p.updated, 40) || t
    };
  }
  function normState(d) {
    return {
      app: "dreamland-studios",
      version: 2,
      lastExport: str(d.lastExport, 40) || null,
      projects: d.projects.slice(0, LIMITS.projects).map(normProject).filter(Boolean)
    };
  }
  function seedState() {
    var old = {};
    try { old = JSON.parse(localStorage.getItem(OLD_KEY) || "{}") || {}; } catch (e) { old = {}; }
    var t = nowISO();
    var projects = SAMPLES.map(function (s, i) {
      var dec = old[i + 1];
      return {
        id: s.id, channelId: s.ch, title: s.title,
        description: "Sample project that shows how the dashboard works. You can edit or delete it.",
        idea: "", stage: s.stage,
        decision: (s.stage === APPROVAL && (dec === "approved" || dec === "rejected")) ? dec : null,
        script: "", scenes: [], previewUrl: "", sample: true, created: t, updated: t
      };
    });
    return { app: "dreamland-studios", version: 2, lastExport: null, projects: projects };
  }
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { storageOk = false; }
    if (raw) {
      try {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.projects)) { return normState(d); }
      } catch (e) { /* fall through */ }
      try { localStorage.setItem(KEY + "_unreadable_copy", raw); } catch (e2) { /* ignore */ }
    }
    return seedState();
  }
  var state = load();

  function save() {
    var before = storageOk;
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      storageOk = true;
    } catch (e) {
      storageOk = false;
      toast("Could not save. Browser storage may be blocked or full. Download a backup.");
    }
    if (before !== storageOk) { updateStorageBanner(); }
    return storageOk;
  }
  function setSaveStatus(text) { if (saveEl && document.body.contains(saveEl)) { saveEl.textContent = text; } }
  function queueSave(p) {
    if (p) { p.updated = nowISO(); }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 400);
    setSaveStatus("Saving...");
  }
  function flushSave() {
    clearTimeout(saveTimer);
    saveTimer = null;
    if (save()) { setSaveStatus("Saved in this browser at " + timeStr()); return true; }
    setSaveStatus("NOT saved. See the warning at the top of the page.");
    return false;
  }
  function updateStorageBanner() {
    var b = document.getElementById("banner-storage");
    b.textContent = "";
    if (!storageOk) {
      b.className = "banner bad";
      b.appendChild(el("b", "", "Storage problem: "));
      b.appendChild(document.createTextNode("this browser is not saving data (private mode, blocked, or full). Changes will be lost when you close this page. Use Backup & data to download a copy."));
      return;
    }
    b.className = "banner";
    b.appendChild(el("b", "", "Saved in this browser only. "));
    b.appendChild(document.createTextNode("localStorage is not cloud storage. Your projects will not appear on your other devices (MacBook vs iPhone) or in other browsers, and clearing browser data erases them. Last backup: " + fmtDate(state.lastExport) + "."));
  }

  /* ---------- Lookups ---------- */
  function channel(id) {
    for (var i = 0; i < CHANNELS.length; i++) { if (CHANNELS[i].id === id) { return CHANNELS[i]; } }
    return { id: id, name: id };
  }
  function findProject(id) {
    for (var i = 0; i < state.projects.length; i++) { if (state.projects[i].id === id) { return state.projects[i]; } }
    return null;
  }
  function status(p) {
    if (p.decision) { return p.decision; }
    return p.stage === APPROVAL ? "review" : "working";
  }
  function statusLabel(p) {
    var s = status(p);
    return s === "review" ? "Awaiting approval" : s === "working" ? "In production" : s === "approved" ? "Approved" : "Rejected";
  }
  function visible() {
    return state.projects.filter(function (p) { return selected === "all" || p.channelId === selected; });
  }
  function decide(p, d) {
    p.decision = d;
    p.updated = nowISO();
    save();
  }

  /* ---------- Navigation ---------- */
  function go(hash) {
    if (location.hash === hash) { route(); } else { location.hash = hash; }
  }
  function setNav(key) {
    var nav = document.getElementById("nav");
    nav.textContent = "";
    [["dash", "Dashboard", "#/"], ["new", "+ New project", "#/new"], ["backup", "Backup & data", "#/backup"]].forEach(function (n) {
      nav.appendChild(btn(n[1], n[0] === key ? "on" : "", function () {
        if (n[0] === "new") { newChannel = selected === "all" ? null : selected; }
        go(n[2]);
      }));
    });
  }
  function clearApp() { app.textContent = ""; saveEl = null; }
  function route() {
    if (saveTimer) { flushSave(); }
    var h = location.hash || "#/";
    var m = h.match(/^#\/project\/([^?]+)$/);
    window.scrollTo(0, 0);
    if (m) { viewProject(decodeURIComponent(m[1])); }
    else if (h === "#/new") { viewNew(); }
    else if (h === "#/backup") { viewBackup(); }
    else { viewDashboard(); }
  }
  function rerenderProject(id) {
    var y = window.pageYOffset;
    viewProject(id);
    window.scrollTo(0, y);
  }

  /* ---------- Form building blocks ---------- */
  function field(labelText, control) {
    var id = "f" + (++fieldCounter);
    control.id = id;
    var w = el("div", "field");
    var l = el("label", "", labelText);
    l.setAttribute("for", id);
    w.appendChild(l);
    w.appendChild(control);
    return w;
  }
  function textInput(value, max) {
    var i = el("input");
    i.type = "text";
    i.value = value || "";
    i.maxLength = max;
    i.setAttribute("autocomplete", "off");
    return i;
  }
  function textArea(value, rows, max, cls) {
    var t = el("textarea", cls || "");
    t.value = value || "";
    t.rows = rows;
    t.maxLength = max;
    return t;
  }
  function boundArea(p, key, rows, max) {
    var t = textArea(p[key], rows, max);
    t.addEventListener("input", function () { p[key] = t.value; queueSave(p); });
    return t;
  }
  function channelSelect(value, withPlaceholder) {
    var s = el("select");
    if (withPlaceholder) {
      var ph = el("option", "", "Choose a channel...");
      ph.value = "";
      s.appendChild(ph);
    }
    var known = false;
    CHANNELS.forEach(function (c) {
      var o = el("option", "", c.name);
      o.value = c.id;
      if (c.id === value) { known = true; }
      s.appendChild(o);
    });
    if (value && !known) {
      var u = el("option", "", value + " (unknown channel)");
      u.value = value;
      s.appendChild(u);
    }
    s.value = value || "";
    return s;
  }
  function panel(title) {
    var d = el("div", "panel");
    d.appendChild(el("h3", "", title));
    return d;
  }
  function hint(text) { return el("p", "hint", text); }

  /* ---------- View: dashboard (v0.1 features kept) ---------- */
  function drawChips(box, redraw) {
    box.textContent = "";
    [{ id: "all", name: "All" }].concat(CHANNELS).forEach(function (c) {
      var b = el("button", "chip" + (c.id === selected ? " on" : ""), c.name);
      b.type = "button";
      b.addEventListener("click", function () { selected = c.id; redraw(); });
      box.appendChild(b);
    });
  }
  function drawStats(box) {
    var n = { review: 0, working: 0, approved: 0, rejected: 0 };
    visible().forEach(function (p) { n[status(p)]++; });
    box.textContent = "";
    [["Awaiting approval", n.review], ["In production", n.working], ["Approved", n.approved], ["Rejected", n.rejected]].forEach(function (s) {
      var card = el("div", "stat");
      card.appendChild(el("b", "", String(s[1])));
      card.appendChild(el("span", "", s[0]));
      box.appendChild(card);
    });
  }
  function drawList(box, redraw) {
    box.textContent = "";
    var items = visible();
    if (!items.length) {
      box.appendChild(el("p", "sub", state.projects.length ? "No projects for this channel yet." : "No projects yet. Tap + New project to start one."));
      return;
    }
    items.forEach(function (p) {
      var st = status(p);
      var ch = channel(p.channelId);
      var card = el("div", "video");
      card.appendChild(el("div", "vtitle", p.title));
      var blurb = p.description || p.idea;
      if (blurb) { card.appendChild(el("div", "desc", blurb)); }

      var meta = el("div", "meta");
      meta.appendChild(el("span", "tag", ch.name));
      if (ch.kids) { meta.appendChild(el("span", "tag kids", "Made for kids: extra rules apply")); }
      if (p.sample) { meta.appendChild(el("span", "tag", "Sample")); }
      meta.appendChild(el("span", "", "Stage " + (p.stage + 1) + " of " + STAGES.length + ": " + STAGES[p.stage]));
      card.appendChild(meta);

      var bar = el("div", "bar");
      var fill = el("div");
      fill.style.width = Math.round(((p.stage + 1) / STAGES.length) * 100) + "%";
      bar.appendChild(fill);
      card.appendChild(bar);

      var row = el("div", "btns");
      if (st === "review") {
        card.appendChild(el("div", "st-review", "Waiting for your approval"));
        var yes = el("button", "act yes", "Approve");
        yes.type = "button";
        yes.addEventListener("click", function () { decide(p, "approved"); redraw(); });
        var no = el("button", "act no", "Reject");
        no.type = "button";
        no.addEventListener("click", function () { decide(p, "rejected"); redraw(); });
        row.appendChild(yes);
        row.appendChild(no);
      } else if (st === "approved" || st === "rejected") {
        card.appendChild(el("div", "st-" + st, st === "approved" ? "Approved (a note to yourself, nothing was published)" : "Rejected"));
        var undo = el("button", "act undo", "Undo");
        undo.type = "button";
        undo.addEventListener("click", function () { decide(p, null); redraw(); });
        row.appendChild(undo);
      } else {
        card.appendChild(el("div", "meta", "In production"));
      }
      row.appendChild(btn("Open / edit", "", function () { go("#/project/" + encodeURIComponent(p.id)); }));
      card.appendChild(row);
      box.appendChild(card);
    });
  }
  function viewDashboard() {
    setNav("dash");
    clearApp();
    var top = el("div", "btns");
    top.appendChild(btn("+ New project", "primary", function () { newChannel = selected === "all" ? null : selected; go("#/new"); }));
    app.appendChild(top);
    var chips = el("div", "chips");
    var stats = el("div", "stats");
    var title = el("h2", "");
    var list = el("div");
    app.appendChild(chips);
    app.appendChild(stats);
    app.appendChild(title);
    app.appendChild(list);
    function draw() {
      drawChips(chips, draw);
      drawStats(stats);
      title.textContent = selected === "all" ? "All channels" : channel(selected).name;
      drawList(list, draw);
    }
    draw();
  }

  /* ---------- View: new project ---------- */
  function viewNew() {
    setNav("new");
    clearApp();
    app.appendChild(el("h2", "", "New project"));
    app.appendChild(hint("This saves a project note in this browser. It does not generate anything, contact YouTube, or publish anything."));
    var form = el("div", "panel");
    var chSel = channelSelect(newChannel, true);
    var tIn = textInput("", LIMITS.title);
    var dIn = textArea("", 3, LIMITS.description);
    var iIn = textArea("", 5, LIMITS.idea);
    form.appendChild(field("YouTube channel (required)", chSel));
    form.appendChild(field("Video title (required)", tIn));
    form.appendChild(field("Description", dIn));
    form.appendChild(field("Idea", iIn));
    var row = el("div", "btns");
    row.appendChild(btn("Save project", "primary", function () {
      var title = tIn.value.trim();
      if (!chSel.value) { toast("Please choose a channel."); chSel.focus(); return; }
      if (!title) { toast("Please enter a video title."); tIn.focus(); return; }
      var t = nowISO();
      var p = normProject({ id: uid(), channelId: chSel.value, title: title, description: dIn.value, idea: iIn.value, stage: 0, created: t, updated: t });
      state.projects.unshift(p);
      if (save()) { toast("Project saved in this browser."); }
      go("#/project/" + encodeURIComponent(p.id));
    }));
    row.appendChild(btn("Cancel", "", function () { go("#/"); }));
    form.appendChild(row);
    app.appendChild(form);
  }

  /* ---------- View: one project ---------- */
  function setStage(p, n) {
    if (n < 0 || n >= STAGES.length || n === p.stage) { return; }
    if (p.decision && n !== APPROVAL) {
      if (!confirm("This project is marked " + p.decision + ". Moving it out of the Approval stage clears that decision. Continue?")) { return; }
      p.decision = null;
    }
    p.stage = n;
    p.updated = nowISO();
    save();
    rerenderProject(p.id);
  }

  function renderScenes(p, box, countEl) {
    box.textContent = "";
    countEl.textContent = "Scene planning (" + p.scenes.length + ")";
    if (!p.scenes.length) { box.appendChild(hint("No scenes yet. Tap Add scene to start planning.")); }
    p.scenes.forEach(function (s, i) {
      var card = el("div", "scene");
      var head = el("div", "scenehead");
      head.appendChild(el("b", "", "Scene " + (i + 1)));
      var tools = el("div", "btns");
      var up = btn("Up", "small", function () {
        if (i === 0) { return; }
        p.scenes.splice(i - 1, 0, p.scenes.splice(i, 1)[0]);
        queueSave(p); flushSave(); renderScenes(p, box, countEl);
      });
      var down = btn("Down", "small", function () {
        if (i === p.scenes.length - 1) { return; }
        p.scenes.splice(i + 1, 0, p.scenes.splice(i, 1)[0]);
        queueSave(p); flushSave(); renderScenes(p, box, countEl);
      });
      var del = btn("Delete", "small danger", function () {
        if (!confirm("Delete scene " + (i + 1) + "?")) { return; }
        p.scenes.splice(i, 1);
        queueSave(p); flushSave(); renderScenes(p, box, countEl);
      });
      tools.appendChild(up); tools.appendChild(down); tools.appendChild(del);
      head.appendChild(tools);
      card.appendChild(head);

      function bindScene(key, labelText, rows, max, isLine) {
        var c = isLine ? textInput(s[key], max) : textArea(s[key], rows, max);
        c.addEventListener("input", function () { s[key] = c.value; queueSave(p); });
        card.appendChild(field(labelText, c));
        return c;
      }
      bindScene("title", "Scene title or summary", 0, LIMITS.title, true);
      bindScene("imagePrompt", "Image prompt (for images you make yourself for now)", 3, LIMITS.scene, false);
      bindScene("animation", "Animation instructions", 3, LIMITS.scene, false);
      bindScene("narration", "Narration", 3, LIMITS.scene, false);
      box.appendChild(card);
    });
  }

  function viewProject(id) {
    var p = findProject(id);
    setNav("");
    clearApp();
    if (!p) {
      app.appendChild(el("p", "sub", "Project not found. It may have been deleted."));
      app.appendChild(btn("Back to dashboard", "primary", function () { go("#/"); }));
      return;
    }
    app.appendChild(btn("← Dashboard", "", function () { go("#/"); }));

    var head = el("div");
    var h = el("h2", "");
    var meta = el("div", "meta");
    head.appendChild(h);
    head.appendChild(meta);
    app.appendChild(head);
    function refreshHead() {
      h.textContent = p.title || "(untitled)";
      meta.textContent = "";
      var ch = channel(p.channelId);
      meta.appendChild(el("span", "tag", ch.name));
      if (ch.kids) { meta.appendChild(el("span", "tag kids", "Made for kids: extra rules apply")); }
      meta.appendChild(el("span", "tag st-" + status(p), statusLabel(p)));
      if (p.sample) { meta.appendChild(el("span", "tag", "Sample")); }
    }
    refreshHead();

    saveEl = el("div", "savestat", "Changes save automatically in this browser.");
    app.appendChild(saveEl);
    var jump = el("div", "jump");
    app.appendChild(jump);

    /* Details */
    var pd = panel("Details");
    var chSel = channelSelect(p.channelId, false);
    chSel.addEventListener("change", function () { p.channelId = chSel.value; queueSave(p); refreshHead(); });
    pd.appendChild(field("YouTube channel", chSel));
    var tIn = textInput(p.title, LIMITS.title);
    tIn.addEventListener("input", function () { p.title = tIn.value; queueSave(p); refreshHead(); });
    tIn.addEventListener("change", function () {
      var v = tIn.value.trim() || "Untitled project";
      tIn.value = v; p.title = v; queueSave(p); refreshHead();
    });
    pd.appendChild(field("Video title", tIn));
    pd.appendChild(field("Description", boundArea(p, "description", 3, LIMITS.description)));
    pd.appendChild(field("Idea", boundArea(p, "idea", 4, LIMITS.idea)));
    app.appendChild(pd);

    /* Production tracker */
    var pt = panel("Production tracker");
    var steps = el("div", "steps");
    STAGES.forEach(function (name, i) {
      var b = el("button", "step" + (i < p.stage ? " done" : "") + (i === p.stage ? " cur" : ""), (i + 1) + ". " + name);
      b.type = "button";
      b.addEventListener("click", function () { setStage(p, i); });
      steps.appendChild(b);
    });
    pt.appendChild(steps);
    var bar = el("div", "bar");
    var fill = el("div");
    fill.style.width = Math.round(((p.stage + 1) / STAGES.length) * 100) + "%";
    bar.appendChild(fill);
    pt.appendChild(bar);
    pt.appendChild(el("div", "hint", "Current stage: " + STAGES[p.stage] + " (" + (p.stage + 1) + " of " + STAGES.length + "). Tap a stage to jump to it."));
    var trow = el("div", "btns");
    trow.appendChild(btn("← Back a stage", "", function () { setStage(p, p.stage - 1); }));
    trow.appendChild(btn("Next stage →", "primary", function () { setStage(p, p.stage + 1); }));
    pt.appendChild(trow);
    app.appendChild(pt);

    /* Script workspace */
    var ps = panel("Script workspace");
    ps.appendChild(hint("Write or paste your script here. It saves automatically in this browser."));
    var sc = textArea(p.script, 14, LIMITS.script, "script");
    sc.setAttribute("spellcheck", "true");
    var count = el("div", "hint");
    function updCount() {
      var w = (sc.value.trim().match(/\S+/g) || []).length;
      count.textContent = w + " words, about " + Math.round(w / 150 * 60) + " seconds spoken at roughly 150 words per minute.";
    }
    sc.addEventListener("input", function () { p.script = sc.value; queueSave(p); updCount(); });
    updCount();
    ps.appendChild(sc);
    ps.appendChild(count);
    var srow = el("div", "btns");
    srow.appendChild(btn("Save script", "primary", function () {
      p.script = sc.value; p.updated = nowISO();
      if (flushSave()) { toast("Script saved in this browser."); }
    }));
    srow.appendChild(btn("Copy script", "", function () {
      function fallback() { sc.focus(); sc.select(); try { document.execCommand("copy"); toast("Script copied."); } catch (e) { toast("Select the text and copy it manually."); } }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(sc.value).then(function () { toast("Script copied."); }, fallback);
      } else { fallback(); }
    }));
    ps.appendChild(srow);
    app.appendChild(ps);

    /* Scene planning */
    var pn = panel("Scene planning");
    var countEl = pn.firstChild;
    pn.appendChild(hint("Your own notes for each scene. Nothing here generates images, animation, or audio."));
    var scenesBox = el("div");
    pn.appendChild(scenesBox);
    renderScenes(p, scenesBox, countEl);
    var nrow = el("div", "btns");
    nrow.appendChild(btn("+ Add scene", "primary", function () {
      if (p.scenes.length >= LIMITS.scenes) { toast("That is the maximum number of scenes."); return; }
      p.scenes.push(normScene({ id: uid() }));
      queueSave(p); flushSave();
      renderScenes(p, scenesBox, countEl);
      var inputs = scenesBox.querySelectorAll("input");
      if (inputs.length) { inputs[inputs.length - 1].focus(); }
    }));
    pn.appendChild(nrow);
    app.appendChild(pn);

    /* Approval and preview */
    var pa = panel("Approval and final video preview");
    pa.appendChild(hint("Paste a link to the finished video, for example a private or unlisted upload or a shared file. Nothing is uploaded from here."));
    var pv = textInput(p.previewUrl, LIMITS.url);
    pv.setAttribute("inputmode", "url");
    pv.setAttribute("autocapitalize", "off");
    pv.setAttribute("placeholder", "https://...");
    pa.appendChild(field("Final video preview link", pv));
    var linkBox = el("div", "linkbox");
    pa.appendChild(linkBox);
    function updLink() {
      linkBox.textContent = "";
      var u = safeUrl(pv.value);
      if (u) {
        var a = el("a", "", "Open preview in a new tab");
        a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer";
        linkBox.appendChild(a);
      } else if (pv.value.trim()) {
        linkBox.appendChild(el("span", "st-rejected", "That does not look like a web link. It needs to start with http:// or https://"));
      } else {
        linkBox.appendChild(el("span", "hint", "No preview link yet. You can still approve, but it is best to watch the finished video first."));
      }
    }
    pv.addEventListener("input", function () { p.previewUrl = pv.value; queueSave(p); updLink(); });
    updLink();

    var st = status(p);
    var arow = el("div", "btns");
    if (p.stage !== APPROVAL) {
      pa.appendChild(el("p", "hint", "Approval opens when this project reaches the Approval stage."));
      arow.appendChild(btn("Move to Approval stage", "", function () { setStage(p, APPROVAL); }));
    } else if (st === "review") {
      pa.appendChild(el("p", "st-review", "Waiting for your approval"));
      var yes = el("button", "act yes", "Approve");
      yes.type = "button";
      yes.addEventListener("click", function () { decide(p, "approved"); rerenderProject(p.id); });
      var no = el("button", "act no", "Reject");
      no.type = "button";
      no.addEventListener("click", function () { decide(p, "rejected"); rerenderProject(p.id); });
      arow.appendChild(yes);
      arow.appendChild(no);
    } else {
      pa.appendChild(el("p", "st-" + st, st === "approved" ? "Approved. This is a note to yourself. To publish, upload the video manually in YouTube Studio." : "Rejected"));
      var undo = el("button", "act undo", "Undo");
      undo.type = "button";
      undo.addEventListener("click", function () { decide(p, null); rerenderProject(p.id); });
      arow.appendChild(undo);
    }
    pa.appendChild(arow);
    app.appendChild(pa);

    /* Delete */
    var px = panel("Delete project");
    px.appendChild(hint("Deleting removes this project from this browser. It cannot be undone unless you have a JSON backup."));
    var xrow = el("div", "btns");
    xrow.appendChild(btn("Delete this project", "danger", function () {
      if (!confirm("Delete \"" + p.title + "\"? This cannot be undone unless you have a backup.")) { return; }
      var i = state.projects.indexOf(p);
      if (i >= 0) { state.projects.splice(i, 1); }
      save();
      toast("Project deleted.");
      go("#/");
    }));
    px.appendChild(xrow);
    app.appendChild(px);

    [["Details", pd], ["Tracker", pt], ["Script", ps], ["Scenes", pn], ["Approval", pa]].forEach(function (j) {
      jump.appendChild(btn(j[0], "small", function () { j[1].scrollIntoView({ behavior: "smooth", block: "start" }); }));
    });
  }

  /* ---------- View: backup & data ---------- */
  function exportBackup() {
    var payload = { app: "dreamland-studios", version: 2, exportedAt: nowISO(), projects: state.projects };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "dreamland-backup-" + dateStr() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    state.lastExport = nowISO();
    save();
    updateStorageBanner();
    toast("Backup downloaded. Keep the file somewhere safe.");
    if (location.hash === "#/backup") { viewBackup(); }
  }
  function importFile(mode, file) {
    if (!file) { return; }
    if (file.size > 6 * 1024 * 1024) { toast("That file is too large to be a DreamLand backup."); return; }
    var r = new FileReader();
    r.onerror = function () { toast("Could not read that file."); };
    r.onload = function () {
      var data;
      try { data = JSON.parse(String(r.result)); } catch (e) { toast("That file is not valid JSON."); return; }
      if (!data || data.app !== "dreamland-studios" || !Array.isArray(data.projects)) { toast("That does not look like a DreamLand backup file."); return; }
      var incoming = data.projects.slice(0, LIMITS.projects).map(normProject).filter(Boolean);
      if (mode === "replace") {
        if (!confirm("Replace all " + state.projects.length + " projects in this browser with the " + incoming.length + " from the backup?")) { return; }
        state.projects = incoming;
      } else {
        var used = {};
        state.projects.forEach(function (p) { used[p.id] = true; });
        incoming.forEach(function (p) {
          if (used[p.id]) { p.id = uid(); }
          used[p.id] = true;
          state.projects.push(p);
        });
        if (state.projects.length > LIMITS.projects) { state.projects = state.projects.slice(0, LIMITS.projects); }
      }
      if (save()) { toast("Imported " + incoming.length + " project(s)."); }
      viewBackup();
    };
    r.readAsText(file);
  }
  function viewBackup() {
    setNav("backup");
    clearApp();
    app.appendChild(el("h2", "", "Backup & data"));

    var pw = panel("Where your projects are stored");
    var ul = el("ul", "list");
    [
      "Your projects are saved in this browser's localStorage, on this device, for this website address only.",
      "localStorage is not cloud storage. Nothing is uploaded anywhere.",
      "It will not automatically sync between devices. Projects you make on your MacBook will not appear on your iPhone, and the reverse.",
      "Different browsers on the same device do not share it either (for example Firefox and Safari).",
      "Clearing browsing or website data, or using a private window, can erase it.",
      "To move or protect your work, download a JSON backup and import it where you need it."
    ].forEach(function (t) { ul.appendChild(el("li", "", t)); });
    pw.appendChild(ul);
    var size = Math.round(JSON.stringify(state).length / 1024);
    pw.appendChild(el("p", "hint", state.projects.length + " project(s), about " + size + " KB. Last backup: " + fmtDate(state.lastExport) + "."));
    app.appendChild(pw);

    var pe = panel("Export a backup");
    pe.appendChild(hint("Downloads all your projects as one JSON file. On iPhone, if the file opens as text, tap the Share button and choose Save to Files."));
    var erow = el("div", "btns");
    erow.appendChild(btn("Download backup (.json)", "primary", exportBackup));
    pe.appendChild(erow);
    app.appendChild(pe);

    var pi = panel("Import a backup");
    pi.appendChild(hint("Choose a DreamLand backup file. Replace swaps everything in this browser for the file's contents. Add keeps what you have and adds the file's projects as new copies."));
    var fileIn = el("input");
    fileIn.type = "file";
    fileIn.accept = ".json,application/json";
    fileIn.style.display = "none";
    var importMode = "replace";
    fileIn.addEventListener("change", function () {
      var f = fileIn.files && fileIn.files[0];
      importFile(importMode, f);
      fileIn.value = "";
    });
    pi.appendChild(fileIn);
    var irow = el("div", "btns");
    irow.appendChild(btn("Import and replace everything", "", function () { importMode = "replace"; fileIn.click(); }));
    irow.appendChild(btn("Import and add to existing", "", function () { importMode = "add"; fileIn.click(); }));
    pi.appendChild(irow);
    app.appendChild(pi);

    var pc = panel("Clean up");
    pc.appendChild(hint("Download a backup first if you might want anything back."));
    var crow = el("div", "btns");
    var samples = state.projects.filter(function (p) { return p.sample; }).length;
    crow.appendChild(btn("Delete sample projects (" + samples + ")", "danger", function () {
      if (!samples) { toast("There are no sample projects."); return; }
      if (!confirm("Delete the " + samples + " sample project(s)? Your own projects are not touched.")) { return; }
      state.projects = state.projects.filter(function (p) { return !p.sample; });
      save(); toast("Sample projects deleted."); viewBackup();
    }));
    crow.appendChild(btn("Delete ALL projects", "danger", function () {
      if (!state.projects.length) { toast("There are no projects."); return; }
      if (!confirm("Delete all " + state.projects.length + " projects from this browser? This cannot be undone.")) { return; }
      if (!confirm("Last check: are you sure? Download a backup first if you are not.")) { return; }
      state.projects = [];
      save(); toast("All projects deleted."); viewBackup();
    }));
    pc.appendChild(crow);
    app.appendChild(pc);
  }

  /* ---------- Start ---------- */
  window.addEventListener("hashchange", route);
  window.addEventListener("pagehide", function () { if (saveTimer) { flushSave(); } });
  document.addEventListener("visibilitychange", function () { if (document.hidden && saveTimer) { flushSave(); } });

  save();
  updateStorageBanner();
  route();
})();
</script>
</body>
</html>
